<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LDraw Step Viewer</title>
<script>
  // Apply the saved theme before CSS paints to avoid a dark-theme flash.
  // Light is the default for first-time visitors and when storage is unavailable.
  (() => {
    try {
      const savedTheme = localStorage.getItem('draw-viewer-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {
      // localStorage may be unavailable in restrictive/private contexts.
      // Keep the HTML default: light.
    }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-tertiary: #1a1a26;
    --bg-hover: #22223a;
    --accent: #f7c948;
    --accent-dim: rgba(247, 201, 72, 0.15);
    --accent-glow: rgba(247, 201, 72, 0.3);
    --text-primary: #e8e6e3;
    --text-secondary: #8a8a9a;
    --text-muted: #55556a;
    --border: #2a2a3a;
    --danger: #f87171;
    --scene-bg: #0a0a0f;
    --grid-a: #2a2a3a;
    --grid-b: #1a1a26;
    --bom-bg: rgba(18,18,26,0.92);
    --bom-border: rgba(42,42,58,0.8);
    --instr-bg: #f3f0e9;
    --instr-card: #ffffff;
    --instr-text: #1a1a2e;
    --instr-muted: #6a6a88;
    --instr-border: #b0b8c8;
  }

  :root[data-theme="light"] {
    --bg-primary: #eaeaf0;
    --bg-secondary: #ffffff;
    --bg-tertiary: #e0e0ea;
    --bg-hover: #d2d2de;
    --accent: #c88500;
    --accent-dim: rgba(200, 133, 0, 0.1);
    --accent-glow: rgba(200, 133, 0, 0.25);
    --text-primary: #1a1a2e;
    --text-secondary: #5a5a72;
    --text-muted: #8888a0;
    --border: #c8c8d6;
    --danger: #dc2626;
    --scene-bg: #dde0e8;
    --grid-a: #c0c0d0;
    --grid-b: #d0d0dc;
    --bom-bg: rgba(255,255,255,0.94);
    --bom-border: rgba(200,200,214,0.8);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  .app { display: grid; grid-template-rows: 52px 1fr 58px; height: 100vh; }

  /* ─── Header ─── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    z-index: 30;
  }

  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }

  .logo-icon {
    width: 26px; height: 26px; background: var(--accent);
    border-radius: 5px; display: grid; place-items: center;
    font-size: 13px; color: #000; font-weight: 700;
  }

  .file-info {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-secondary); background: var(--bg-tertiary);
    padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border);
  }

  .hdr-actions { display: flex; gap: 6px; align-items: center; }

  .btn {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-tertiary);
    color: var(--text-primary); font-family: 'Outfit', sans-serif;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }

  .btn:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--accent); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn.primary {
    background: var(--accent); color: #000;
    border-color: var(--accent); font-weight: 600;
  }

  .btn.primary:hover:not(:disabled) {
    filter: brightness(1.1); box-shadow: 0 0 12px var(--accent-glow);
  }

  .btn.active {
    background: var(--accent); color: #000;
    border-color: var(--accent);
  }

  .btn-icon {
    width: 32px; height: 32px; padding: 0;
    display: grid; place-items: center; font-size: 15px; border-radius: 6px;
  }

  /* ─── Main ─── */
  .main-area { position: relative; overflow: hidden; }

  .main-area.dragover::after {
    content: 'Drop LDraw file';
    position: absolute;
    inset: 10px;
    z-index: 25;
    display: grid;
    place-items: center;
    border: 2px dashed var(--accent);
    border-radius: 12px;
    background: color-mix(in srgb, var(--bg-primary) 82%, transparent);
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
  }

  #canvas-container { width: 100%; height: 100%; background: var(--bg-primary); }
  #canvas-container canvas { width: 100% !important; height: 100% !important; display: block; }

  /* ─── Drop Zone ─── */
  .drop-zone {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; background: var(--bg-primary); transition: opacity 0.3s;
  }
  .drop-zone.hidden { opacity: 0; pointer-events: none; }

  .drop-zone-inner {
    border: 2px dashed var(--border); border-radius: 14px;
    padding: 50px 70px; display: flex; flex-direction: column;
    align-items: center; gap: 12px; cursor: pointer; transition: all 0.3s;
  }

  .drop-zone-inner:hover, .drop-zone.dragover .drop-zone-inner {
    border-color: var(--accent); background: var(--accent-dim);
    box-shadow: 0 0 30px var(--accent-glow);
  }

  .drop-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--bg-tertiary); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 24px; transition: all 0.3s;
  }

  .drop-zone-inner:hover .drop-icon { background: var(--accent-dim); border-color: var(--accent); }
  .drop-title { font-size: 16px; font-weight: 600; }
  .drop-sub { font-size: 12px; color: var(--text-secondary); }
  .drop-formats { display: flex; gap: 5px; }

  .fmt {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    padding: 2px 6px; border-radius: 3px;
    background: var(--bg-tertiary); border: 1px solid var(--border);
    color: var(--text-secondary);
  }

  /* ─── Loading ─── */
  .loading {
    position: absolute; inset: 0; background: rgba(10,10,15,0.9);
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; z-index: 20;
  }
  .loading.visible { display: flex; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 13px; color: var(--text-secondary); }
  .load-sub { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  /* ─── Step overlay ─── */
  .step-overlay {
    position: absolute; top: 12px; left: 12px; z-index: 5; display: none;
  }
  .step-overlay.visible { display: flex; flex-direction: column; gap: 6px; }

  .step-badge {
    background: var(--bom-bg); border: 1px solid var(--bom-border);
    border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(10px);
  }

  .step-label {
    font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px;
  }

  .step-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1;
  }

  .step-tot {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; color: var(--text-muted);
  }

  /* ─── BOM Panel ─── */
  .bom-panel {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    display: none; background: var(--bom-bg);
    border: 1px solid var(--bom-border); border-radius: 10px;
    padding: 10px 14px; backdrop-filter: blur(10px); max-width: 260px;
  }
  .bom-panel.visible { display: block; }

  .bom-title {
    font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }

  .bom-list { display: flex; flex-wrap: wrap; gap: 6px; }

  .bom-item {
    display: flex; align-items: center; gap: 5px;
    background: var(--bg-tertiary); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px;
  }

  .bom-color {
    width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0;
  }

  .bom-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-secondary); }
  .bom-qty { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 2px; }

  /* ─── Hints ─── */
  .hints {
    position: absolute; bottom: 12px; right: 12px;
    z-index: 5; display: none; gap: 6px;
  }
  .hints.visible { display: flex; }

  .hint {
    font-size: 10px; color: var(--text-muted);
    background: var(--bom-bg); border: 1px solid var(--bom-border);
    border-radius: 5px; padding: 3px 6px; backdrop-filter: blur(10px);
  }
  .hint kbd {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg-tertiary); padding: 0 3px; border-radius: 2px; margin-right: 3px;
  }

  /* ─── Footer ─── */
  footer {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 0 16px;
    border-top: 1px solid var(--border); background: var(--bg-secondary);
  }
  footer.disabled { opacity: 0.3; pointer-events: none; }

  .progress { flex: 1; max-width: 360px; height: 3px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }

  .step-txt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-secondary); min-width: 60px; text-align: center;
  }

  #file-input { display: none; }

  /* ═══════════════════════════════════════════════════
     INSTRUCTION MODE — Scrollable booklet overlay
     ═══════════════════════════════════════════════════ */
  .instr-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    background: var(--instr-bg);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .instr-overlay.visible { display: block; }

  .instr-header {
    position: sticky; top: 0; z-index: 51;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 2px solid var(--instr-border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .instr-header-title {
    font-size: 16px; font-weight: 700; color: var(--instr-text);
  }

  .instr-close-btn {
    padding: 6px 14px; border-radius: 6px;
    border: 1px solid var(--instr-border); background: #f0f0f4;
    color: var(--instr-text); font-family: 'Outfit', sans-serif;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }

  .instr-close-btn:hover { background: #e0e0e8; }

  .instr-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px 20px 40px;
    max-width: 820px;
    margin: 0 auto;
  }

  /* Each step card */
  .instr-card {
    background: var(--instr-card);
    border-radius: 12px;
    border: 1px solid var(--instr-border);
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .instr-card-header {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #e8e8f0;
  }

  .instr-step-num {
    font-family: 'Outfit', sans-serif;
    font-size: 32px; font-weight: 800;
    color: var(--instr-text);
    line-height: 1;
    min-width: 36px;
  }

  .instr-bom-box {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    border: 1.5px solid #d0d4e0;
    border-radius: 8px;
    padding: 8px 10px;
    background: #f8f8fc;
  }

  .instr-bom-entry {
    display: flex; align-items: center; gap: 6px;
    background: #eef0f6;
    border: 1px solid #d8dce6;
    border-radius: 6px;
    padding: 6px 10px;
  }

  .instr-bom-swatch {
    width: 22px; height: 22px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.12);
    flex-shrink: 0;
  }

  .instr-bom-info {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }

  .instr-bom-qty {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 800;
    color: var(--instr-text);
    flex-shrink: 0;
  }

  .instr-bom-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--instr-muted);
  }

  /* The 3D render area */
  .instr-render {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--instr-bg);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .instr-render canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .instr-action-label {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 2;
    padding: 6px 9px;
    border-radius: 7px;
    background: rgba(255,255,255,0.92);
    border: 1px solid #c9d0dc;
    color: #28313a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    pointer-events: none;
  }

  .instr-action-label .current-key {
    color: #16823c;
  }

  .instr-action-label .previous-key {
    color: #77818d;
  }

  .instr-generating {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; padding: 40px; color: var(--instr-muted);
    font-size: 13px;
  }

  .instr-generating .spinner {
    border-color: var(--instr-border);
    border-top-color: #6a6a88;
  }
  @media (max-width: 700px) {
    .app { grid-template-rows: 48px 1fr 54px; }
    header { padding: 0 8px; }
    .logo span { display: none; }
    .file-info { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { padding: 6px 8px; }
    footer { gap: 5px; padding: 0 7px; }
    footer .progress { max-width: none; }
    #btn-first, #btn-last { display: none; }
    .hints { display: none !important; }
    .instr-grid { padding: 12px 8px 24px; gap: 14px; }
    .instr-card-header { padding: 10px; gap: 8px; }
    .instr-step-num { font-size: 26px; min-width: 30px; }
    .instr-bom-entry { padding: 4px 7px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">▦</div>
      <span>LDraw Viewer</span>
    </div>
    <div id="file-info" class="file-info" style="display:none"></div>
    <div class="hdr-actions">
      <button class="btn" id="btn-instr" onclick="openInstructions()" style="display:none">📖 Instructions</button>
      <button class="btn btn-icon" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
      <button class="btn" onclick="document.getElementById('file-input').click()">📂 Open</button>
    </div>
  </header>

  <div class="main-area">
    <div id="canvas-container"></div>

    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-inner" onclick="document.getElementById('file-input').click()">
        <div class="drop-icon">▦</div>
        <div class="drop-title">Drop your LDraw file here</div>
        <div class="drop-sub">or click to browse</div>
        <div class="drop-formats">
          <span class="fmt">.ldr</span>
          <span class="fmt">.mpd</span>
          <span class="fmt">.dat</span>
        </div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="load-text" id="load-text">Loading...</div>
      <div class="load-sub" id="load-sub"></div>
    </div>

    <div class="step-overlay" id="step-overlay">
      <div class="step-badge">
        <div class="step-label">Build Step</div>
        <span class="step-num" id="step-num">1</span>
        <span class="step-tot" id="step-tot">/ 1</span>
      </div>
    </div>

    <div class="bom-panel" id="bom-panel">
      <div class="bom-title">Parts in this step</div>
      <div class="bom-list" id="bom-list"></div>
    </div>

    <div class="hints" id="hints">
      <div class="hint"><kbd>←→</kbd> Steps</div>
      <div class="hint"><kbd>Drag</kbd> Rotate</div>
      <div class="hint"><kbd>Scroll</kbd> Zoom</div>
    </div>

    <input type="file" id="file-input" accept=".ldr,.mpd,.dat" />
  </div>

  <footer class="disabled" id="footer">
    <button class="btn" id="btn-first" onclick="goToStep(0)">⏮</button>
    <button class="btn" id="btn-prev" onclick="prevStep()">← Prev</button>
    <div class="progress"><div class="progress-bar" id="pbar"></div></div>
    <span class="step-txt" id="ftxt">0 / 0</span>
    <button class="btn primary" id="btn-next" onclick="nextStep()">Next →</button>
    <button class="btn" id="btn-last" onclick="goToStep(window._totalSteps-1)">⏭</button>
  </footer>
</div>

<!-- INSTRUCTION MODE OVERLAY -->
<div class="instr-overlay" id="instr-overlay">
  <div class="instr-header">
    <div class="instr-header-title" id="instr-title">Build Instructions</div>
    <button class="instr-close-btn" onclick="closeInstructions()">✕ Close</button>
  </div>
  <div class="instr-grid" id="instr-grid"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">

// ═══════════════════════════════════════

// ═══════════════════════════════════════

  84:'#C9CAE2',85:'#5A3463',86:'#6E5951',100:'#EEB4A4',110:'#2F4F7F',

  178:'#CC702A',183:'#F8F8F8',191:'#FCAC00',212:'#A3C5E8',216:'#990000',
  226:'#F4F47C',232:'#69B9E3',272:'#0A3463',288:'#008F2D',295:'#FF94C2',
  308:'#352100',320:'#680028',321:'#009742',322:'#5DADE2',323:'#AFDEE0',
  326:'#D7F000',330:'#796E65',334:'#C67020',335:'#5F758C',351:'#FF8080',

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let scene, camera, renderer, controls, gridHelper;
let model = null;
let loader = null;
let rawText = '';
let fileName = '';
const THEME_STORAGE_KEY = 'draw-viewer-theme';
let isDark = document.documentElement.dataset.theme === 'dark';

let stepData = [];
let currentStep = 0;
let loadRevision = 0;

let instructionRevision = 0;
let instructionReady = false;
let instructionGenerating = false;
let instructionObjectUrls = [];

// ═══════════════════════════════════════
// SCENE
// ═══════════════════════════════════════
function initScene() {
  const el = document.getElementById('canvas-container');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(isDark ? 0x0a0a0f : 0xdde0e8);

  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
  camera.position.set(150, 200, 250);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 0.9;
  el.appendChild(renderer.domElement);

  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment();
  scene.environment = pmrem.fromScene(room, 0.04).texture;
  scene.environmentIntensity = 0.22;
  room.dispose();
  pmrem.dispose();

  scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe3e0, 0.5));

  const d1 = new THREE.DirectionalLight(0xffffff, 1.25);
  d1.position.set(-140, 260, 180);
  scene.add(d1);

  rebuildGrid();

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;

  const resize = () => {
    const w = Math.max(1, el.clientWidth);
    const h = Math.max(1, el.clientHeight);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  };

  resize();
  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(el);

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

function rebuildGrid() {
  if (gridHelper) {
    scene.remove(gridHelper);
    gridHelper.geometry.dispose();
    gridHelper.material.dispose();
  }

  gridHelper = new THREE.GridHelper(
    400,
    20,
    isDark ? 0x2a2a3a : 0xb4bac8,
    isDark ? 0x1a1a26 : 0xcbd0da
  );
  scene.add(gridHelper);
}

// ═══════════════════════════════════════
// LOADER
// ═══════════════════════════════════════
async function createLoader() {
  const nextLoader = new LDrawLoader();
  nextLoader.setPartsLibraryPath(PARTS_URL);

  showLoad('Loading colors...', 'Preparing LDraw material library');
  try {
    // LDrawLoader has a dedicated LDConfig parser. Parsing LDConfig as a model
    // leaves the material library incomplete, so use the intended API here.
    await nextLoader.preloadMaterials(COLORS_URL);
  } catch (err) {
    console.warn('LDConfig preload failed. Falling back to loader defaults.', err);
  }

  return nextLoader;
}

function normalizeStepDirectives(text) {
  // three.js r162 understands STEP but not ROTSTEP. ROTSTEP is also a build
  // boundary, so normalize it while intentionally ignoring its camera hint.
  return text.replace(/^(\s*0\s+)ROTSTEP(?:\s+.*)?$/gim, '$1STEP');
}

function loadTextWithLoader(ldrawLoader, text) {
  const normalized = normalizeStepDirectives(text);
  const blobUrl = URL.createObjectURL(new Blob([normalized], { type: 'text/plain' }));

  return new Promise((resolve, reject) => {
    ldrawLoader.load(
      blobUrl,
      group => {
        URL.revokeObjectURL(blobUrl);
        resolve(group);
      },
      undefined,
      err => {
        URL.revokeObjectURL(blobUrl);
        reject(err instanceof Error ? err : new Error(String(err || 'Unknown LDraw load error')));
      }
    );
  });
}

// ═══════════════════════════════════════
// MODEL PREPARATION / BUILD STEPS
// ═══════════════════════════════════════
function isRenderable(obj) {
  return Boolean(obj && (obj.isMesh || obj.isLineSegments));
}

function isolateMaterials(root) {
  root.traverse(obj => {
    if (!isRenderable(obj) || !obj.material) return;

    obj.material = Array.isArray(obj.material)
      ? obj.material.map(material => material.clone())
      : obj.material.clone();

    const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const material of materials) {
      material.userData = { ...material.userData };
      material.userData.__viewerBaseOpacity = Number.isFinite(material.opacity) ? material.opacity : 1;
      material.userData.__viewerBaseTransparent = Boolean(material.transparent);
      material.userData.__viewerBaseDepthWrite = material.depthWrite !== false;
      material.userData.__viewerBaseColorHex = material.color?.isColor ? material.color.getHex() : null;
    }
  });
}

function polishLDrawMaterials(root) {
  root.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;

    obj.castShadow = true;
    obj.receiveShadow = true;

    const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const material of materials) {
      if (!material.isMeshStandardMaterial && !material.isMeshPhysicalMaterial) continue;

      // LDraw already provides the correct hue. Keep that exact color and only
      // make the surface response less flat, similar to brickids.
      if (!material.transparent && (material.metalness ?? 0) < 0.5) {
        material.roughness = Math.max(0.3, material.roughness ?? 0.3);
        material.metalness = 0;
      }

      material.envMapIntensity = 0.45;
      material.needsUpdate = true;
    }
  });
}

function annotateBuildSteps(root) {
  function visit(obj, inheritedStep) {
    let step = inheritedStep;
    if (obj.isGroup && Number.isFinite(obj.userData?.buildingStep)) {
      step = obj.userData.buildingStep;
    }

    if (isRenderable(obj)) {
      obj.userData.__viewerBuildStep = Number.isFinite(step) ? step : 0;
    }

    for (const child of obj.children) visit(child, step);
  }

  visit(root, 0);
}

function materialFade(material, factor) {
  const baseOpacity = Number.isFinite(material.userData?.__viewerBaseOpacity)
    ? material.userData.__viewerBaseOpacity
    : 1;
  const baseTransparent = Boolean(material.userData?.__viewerBaseTransparent);
  const baseDepthWrite = material.userData?.__viewerBaseDepthWrite !== false;

  material.opacity = baseOpacity * factor;
  material.transparent = baseTransparent || factor < 0.999 || material.opacity < 0.999;
  material.depthWrite = baseDepthWrite && factor >= 0.999;
  material.needsUpdate = true;
}

function setRenderableFade(obj, factor) {
  if (!obj.material) return;
  const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
  materials.forEach(material => materialFade(material, factor));
}

function applyStepAppearance(root, stepIdx, pastOpacity) {
  root.traverse(obj => {
    if (!isRenderable(obj)) return;

    const step = Number.isFinite(obj.userData?.__viewerBuildStep)
      ? obj.userData.__viewerBuildStep
      : 0;

    obj.visible = step <= stepIdx;
    if (obj.visible) {
      setRenderableFade(obj, step === stepIdx ? 1 : pastOpacity);
    }
  });
}

function restoreBaseMaterial(material) {
  const baseOpacity = Number.isFinite(material.userData?.__viewerBaseOpacity)
    ? material.userData.__viewerBaseOpacity
    : 1;
  const baseTransparent = Boolean(material.userData?.__viewerBaseTransparent);
  const baseDepthWrite = material.userData?.__viewerBaseDepthWrite !== false;
  const baseColorHex = material.userData?.__viewerBaseColorHex;

  if (material.color?.isColor && Number.isFinite(baseColorHex)) {
    material.color.setHex(baseColorHex);
  }

  material.opacity = baseOpacity;
  material.transparent = baseTransparent;
  material.depthWrite = baseDepthWrite;
  material.needsUpdate = true;
}

function applyInstructionAppearance(root, stepIdx) {
  root.traverse(obj => {
    if (!isRenderable(obj)) return;

    const step = Number.isFinite(obj.userData?.__viewerBuildStep)
      ? obj.userData.__viewerBuildStep
      : 0;

    obj.visible = step <= stepIdx;
    if (!obj.visible || !obj.material) return;

    const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const material of materials) {
      // Keep every already-built piece in its original LDraw color. The current
      // step is communicated by the exploded placement + green arrow, not by
      // repainting the model.
      restoreBaseMaterial(material);
    }
  });
}

function parseTopLevelStepRefs(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const refsByStep = [[]];
  let currentStepIdx = 0;

  let mpdSeen = false;
  let insideMain = true;

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    if (/^0\s+FILE\s+/i.test(line)) {
      if (mpdSeen) break;
      mpdSeen = true;
      insideMain = true;
      continue;
    }

    if (mpdSeen && /^0\s+NOFILE\b/i.test(line)) break;
    if (!insideMain) continue;

    if (/^0\s+(?:STEP|ROTSTEP)\b/i.test(line)) {
      // LDrawLoader stores STEP as a boolean on the next part. Consecutive
      // empty STEP lines therefore do not create multiple effective steps.
      if (refsByStep[currentStepIdx].length > 0) {
        currentStepIdx += 1;
        refsByStep[currentStepIdx] = [];
      }
      continue;
    }

    if (/^1\s+/.test(line)) {
      const tokens = line.split(/\s+/);
      if (tokens.length >= 15) {
        refsByStep[currentStepIdx].push({
          color: tokens[1],
          partId: tokens.slice(14).join(' '),
        });
      }
    }
  }

  while (refsByStep.length > 1 && refsByStep.at(-1).length === 0) {
    refsByStep.pop();
  }

  return refsByStep;
}

function buildStepData(root, text) {
  const total = Math.max(1, Number(root.userData?.numBuildingSteps) || 1);
  const data = Array.from({ length: total }, () => ({ partRefs: [] }));

  // Prefer physical Part groups from the loader tree. This also handles MPD
  // submodels that have their own STEP directives: pieces inside the nested
  // subassembly land in the same global buildingStep that Three.js renders.
  root.traverse(group => {
    if (!group.isGroup || group === root) return;

    const type = String(group.userData?.type || '');
    if (!/^(?:Part|Unofficial_Part)$/i.test(type)) return;

    const step = Number(group.userData?.buildingStep);
    const partId = group.name || group.userData?.fileName;
    if (!partId || !Number.isFinite(step) || step < 0 || step >= total) return;

    data[step].partRefs.push({
      color: String(group.userData?.colorCode ?? '16'),
      partId,
    });
  });

  // Hand-authored files do not always declare !LDRAW_ORG Part metadata. For
  // empty steps, fall back to named top-level groups before consulting text.
  for (const child of root.children) {
    if (!child.isGroup || !child.name) continue;

    const step = Number(child.userData?.buildingStep);
    if (!Number.isFinite(step) || step < 0 || step >= total) continue;
    if (data[step].partRefs.length > 0) continue;

    data[step].partRefs.push({
      color: String(child.userData?.colorCode ?? '16'),
      partId: child.name,
    });
  }

  // Some files contain direct geometry or unusual MPD layouts. Keep a raw-text
  // parser as the last BOM fallback only; model visibility remains loader-driven.
  const fallback = parseTopLevelStepRefs(text);
  for (let i = 0; i < total; i++) {
    if (data[i].partRefs.length === 0 && fallback[i]?.length) {
      data[i].partRefs = fallback[i];
    }
  }

  return data;
}

// ═══════════════════════════════════════
// BOUNDS / CAMERA
// ═══════════════════════════════════════
function getRenderableBounds(root, visibleOnly = false) {
  const box = new THREE.Box3();
  const temp = new THREE.Box3();

  root.updateMatrixWorld(true);

  root.traverse(obj => {
    if (!isRenderable(obj) || !obj.geometry) return;
    if (visibleOnly && !obj.visible) return;

    if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
    if (!obj.geometry.boundingBox) return;

    temp.copy(obj.geometry.boundingBox).applyMatrix4(obj.matrixWorld);
    box.union(temp);
  });

  return box;
}

function fitCameraToBox(targetCamera, box, direction, margin = 1.18) {
  const center = new THREE.Vector3();
  const size = new THREE.Vector3();

  if (box.isEmpty()) {
    center.set(0, 0, 0);
    size.set(80, 80, 80);
  } else {
    box.getCenter(center);
    box.getSize(size);
  }

  const radius = Math.max(size.length() * 0.5, 12);
  const verticalFov = THREE.MathUtils.degToRad(targetCamera.fov);
  const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * targetCamera.aspect);
  const limitingFov = Math.max(0.2, Math.min(verticalFov, horizontalFov));
  const distance = (radius / Math.sin(limitingFov / 2)) * margin;

  const dir = direction.clone().normalize();
  targetCamera.position.copy(center).addScaledVector(dir, distance);
  targetCamera.near = Math.max(0.1, distance - radius * 2.5);
  targetCamera.far = Math.max(1000, distance + radius * 8);
  targetCamera.lookAt(center);
  targetCamera.updateProjectionMatrix();

  return center;
}

function fitMainCamera() {
  if (!model) return;
  const box = getRenderableBounds(model, false);
  const center = fitCameraToBox(camera, box, new THREE.Vector3(0.72, 0.58, 0.9), 1.24);
  controls.target.copy(center);
  controls.update();
}

// ═══════════════════════════════════════
// LOAD FILE
// ═══════════════════════════════════════
async function loadFile(content, name) {
  const revision = ++loadRevision;
  showLoad('Preparing model...', name);

  let nextModel = null;

  try {
    const nextLoader = await createLoader();
    if (revision !== loadRevision) return;

    showLoad('Loading model...', name);
    nextModel = await loadTextWithLoader(nextLoader, content);

    if (revision !== loadRevision) {
      disposeModel(nextModel);
      return;
    }

    // Convert LDraw's Y-down coordinates to the viewer's Y-up coordinates.
    nextModel.rotation.x = Math.PI;

    // LDrawLoader intentionally reuses materials across parts. Clone them per
    // renderable so fading one build step cannot accidentally fade other steps.
    isolateMaterials(nextModel);
    polishLDrawMaterials(nextModel);
    annotateBuildSteps(nextModel);

    const nextStepData = buildStepData(nextModel, content);

    if (model) {
      scene.remove(model);
      disposeModel(model);
    }

    model = nextModel;
    loader = nextLoader;
    rawText = content;
    fileName = name;
    stepData = nextStepData;
    currentStep = 0;

    scene.add(model);
    fitMainCamera();

    clearInstructionCache();

    document.getElementById('drop-zone').classList.add('hidden');
    document.getElementById('footer').classList.remove('disabled');
    document.getElementById('step-overlay').classList.add('visible');
    document.getElementById('bom-panel').classList.add('visible');
    document.getElementById('hints').classList.add('visible');
    document.getElementById('file-info').style.display = 'block';
    document.getElementById('file-info').textContent = name;
    document.getElementById('btn-instr').style.display = 'flex';

    goToStep(0);
    hideLoad();

  } catch (err) {
    console.error('Load error:', err);
    hideLoad();

    if (nextModel && nextModel !== model) disposeModel(nextModel);

    const message = err?.message || String(err || 'Unknown error');
    alert('Could not load this LDraw file.\n\n' + message);
  }
}

function disposeModel(root) {
  if (!root) return;

  const geometries = new Set();
  const materials = new Set();

  root.traverse(obj => {
    if (obj.geometry) geometries.add(obj.geometry);
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(material => materials.add(material));
    }
  });

  geometries.forEach(geometry => geometry.dispose());
  materials.forEach(material => material.dispose());
}

// ═══════════════════════════════════════
// STEP NAVIGATION
// ═══════════════════════════════════════
function goToStep(idx) {
  const total = stepData.length;
  if (!model || total === 0) return;

  currentStep = Math.max(0, Math.min(Number(idx) || 0, total - 1));
  applyStepAppearance(model, currentStep, MAIN_PAST_OPACITY);
  updateUI();
  updateBOM();
}

function nextStep() { goToStep(currentStep + 1); }
function prevStep() { goToStep(currentStep - 1); }

function updateUI() {
  const total = stepData.length;

  document.getElementById('step-num').textContent = currentStep + 1;
  document.getElementById('step-tot').textContent = '/ ' + total;
  document.getElementById('ftxt').textContent = (currentStep + 1) + ' / ' + total;

  document.getElementById('pbar').style.width =
    (total > 1 ? (currentStep / (total - 1)) * 100 : 100) + '%';

  document.getElementById('btn-prev').disabled = currentStep === 0;
  document.getElementById('btn-first').disabled = currentStep === 0;
  document.getElementById('btn-next').disabled = currentStep === total - 1;
  document.getElementById('btn-last').disabled = currentStep === total - 1;
}

function colorToCss(code) {
  const value = String(code ?? '').trim();

  if (/^0x2[0-9a-f]{6}$/i.test(value)) {
    return '#' + value.slice(3);
  }

  const numeric = Number.parseInt(value, 10);
  return LDRAW_COLORS[numeric] || '#888888';
}

function normalizedPartName(partId) {
  return String(partId || '')
    .replace(/\\/g, '/')
    .split('/')
    .at(-1)
    .replace(/\.(?:dat|ldr|mpd)$/i, '');
}

function groupedPartRefs(partRefs) {
  const grouped = new Map();

  for (const ref of partRefs || []) {
    const key = String(ref.color) + '|' + String(ref.partId);
    const existing = grouped.get(key) || { ...ref, qty: 0 };
    existing.qty += 1;
    grouped.set(key, existing);
  }

  return [...grouped.values()];
}

function updateBOM() {
  const panel = document.getElementById('bom-list');
  panel.replaceChildren();

  const refs = stepData[currentStep]?.partRefs || [];
  if (refs.length === 0) {
    const empty = document.createElement('span');
    empty.style.cssText = 'font-size:11px;color:var(--text-muted)';
    empty.textContent = 'No part info';
    panel.appendChild(empty);
    return;
  }

  for (const { color, partId, qty } of groupedPartRefs(refs)) {
    const item = document.createElement('div');
    item.className = 'bom-item';

    const swatch = document.createElement('div');
    swatch.className = 'bom-color';
    swatch.style.background = colorToCss(color);

    const name = document.createElement('span');
    name.className = 'bom-name';
    name.textContent = normalizedPartName(partId);

    const quantity = document.createElement('span');
    quantity.className = 'bom-qty';
    quantity.textContent = '×' + qty;

    item.append(swatch, name, quantity);
    panel.appendChild(item);
  }
}

// ═══════════════════════════════════════
// THEME
// ═══════════════════════════════════════
function applyTheme(theme, persist = false) {
  const normalizedTheme = theme === 'dark' ? 'dark' : 'light';
  isDark = normalizedTheme === 'dark';

  document.documentElement.dataset.theme = normalizedTheme;

  const toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.textContent = isDark ? '🌙' : '☀️';
    toggle.title = isDark ? 'Switch to light theme' : 'Switch to dark theme';
    toggle.setAttribute('aria-label', toggle.title);
  }

  if (scene) {
    scene.background = new THREE.Color(isDark ? 0x0a0a0f : 0xdde0e8);
    rebuildGrid();
  }

  if (persist) {
    try {
      localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
    } catch (error) {
      console.warn('Could not persist theme preference:', error);
    }
  }
}

function toggleTheme() {
  applyTheme(isDark ? 'light' : 'dark', true);
}

// ═══════════════════════════════════════
// LOADING
// ═══════════════════════════════════════
function showLoad(title, subtitle) {
  document.getElementById('loading').classList.add('visible');
  document.getElementById('load-text').textContent = title || '';
  document.getElementById('load-sub').textContent = subtitle || '';
}

function hideLoad() {
  document.getElementById('loading').classList.remove('visible');
}

// ═══════════════════════════════════════
// FILE INPUT / DRAG-DROP
// ═══════════════════════════════════════
function validateAndReadFile(file) {
  if (!file) return;

  if (!/\.(?:ldr|mpd|dat)$/i.test(file.name)) {
    alert('Please choose an .ldr, .mpd or .dat file.');
    return;
  }

  const reader = new FileReader();
  reader.onerror = () => alert('Could not read this file.');
  reader.onload = event => loadFile(String(event.target.result || ''), file.name);
  reader.readAsText(file);
}

const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', event => {
  validateAndReadFile(event.target.files?.[0]);
  // Selecting the same file again should still trigger change.
  event.target.value = '';
});

const mainArea = document.querySelector('.main-area');
let dragDepth = 0;

mainArea.addEventListener('dragenter', event => {
  event.preventDefault();
  dragDepth += 1;
  mainArea.classList.add('dragover');
});

mainArea.addEventListener('dragover', event => {
  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
});

mainArea.addEventListener('dragleave', event => {
  event.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) mainArea.classList.remove('dragover');
});

mainArea.addEventListener('drop', event => {
  event.preventDefault();
  dragDepth = 0;
  mainArea.classList.remove('dragover');
  validateAndReadFile(event.dataTransfer?.files?.[0]);
});

// ═══════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════
document.addEventListener('keydown', event => {
  if (document.getElementById('instr-overlay').classList.contains('visible')) {
    if (event.key === 'Escape') closeInstructions();
    return;
  }

  if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'n') {
    event.preventDefault();
    nextStep();
  } else if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'p') {
    event.preventDefault();
    prevStep();
  } else if (event.key === 'Home') {
    event.preventDefault();
    goToStep(0);
  } else if (event.key === 'End') {
    event.preventDefault();
    goToStep(stepData.length - 1);
  }
});

// ═══════════════════════════════════════
// INSTRUCTION MODE
// ═══════════════════════════════════════
function openInstructions() {
  if (!model || stepData.length === 0) return;

  document.getElementById('instr-overlay').classList.add('visible');
  document.getElementById('instr-title').textContent =
    'Build Instructions — ' + fileName.replace(/\.[^.]+$/, '');

  if (!instructionReady && !instructionGenerating) {
    generateInstructionCards();
  }
}

function closeInstructions() {
  document.getElementById('instr-overlay').classList.remove('visible');
}

function clearInstructionCache() {
  instructionRevision += 1;
  instructionReady = false;
  instructionGenerating = false;

  for (const url of instructionObjectUrls) URL.revokeObjectURL(url);
  instructionObjectUrls = [];

  document.getElementById('instr-grid').replaceChildren();
}

function buildInstructionBomBox(partRefs) {
  const box = document.createElement('div');
  box.className = 'instr-bom-box';

  const grouped = groupedPartRefs(partRefs);
  if (grouped.length === 0) {
    const empty = document.createElement('span');
    empty.style.cssText = 'font-size:10px;color:#999';
    empty.textContent = '—';
    box.appendChild(empty);
    return box;
  }

  for (const { color, partId, qty } of grouped) {
    const entry = document.createElement('div');
    entry.className = 'instr-bom-entry';

    const swatch = document.createElement('div');
    swatch.className = 'instr-bom-swatch';
    swatch.style.background = colorToCss(color);

    const info = document.createElement('div');
    info.className = 'instr-bom-info';

    const label = document.createElement('span');
    label.className = 'instr-bom-label';
    label.textContent = normalizedPartName(partId);

    const quantity = document.createElement('span');
    quantity.className = 'instr-bom-qty';
    quantity.textContent = qty + 'x';

    info.append(label, quantity);
    entry.append(swatch, info);
    box.appendChild(entry);
  }

  return box;
}

function createInstructionPlaceholders() {
  const grid = document.getElementById('instr-grid');
  grid.replaceChildren();

  for (let stepIdx = 0; stepIdx < stepData.length; stepIdx++) {
    const card = document.createElement('div');
    card.className = 'instr-card';
    card.id = 'instr-card-' + stepIdx;

    const header = document.createElement('div');
    header.className = 'instr-card-header';

    const number = document.createElement('div');
    number.className = 'instr-step-num';
    number.textContent = stepIdx + 1;

    header.append(number, buildInstructionBomBox(stepData[stepIdx].partRefs));

    const render = document.createElement('div');
    render.className = 'instr-render';
    render.id = 'instr-render-' + stepIdx;

    const generating = document.createElement('div');
    generating.className = 'instr-generating';

    const spinner = document.createElement('div');
    spinner.className = 'spinner';

    const text = document.createElement('span');
    text.textContent = 'Rendering step ' + (stepIdx + 1) + '/' + stepData.length + '...';

    generating.append(spinner, text);
    render.appendChild(generating);
    card.append(header, render);
    grid.appendChild(card);
  }
}

function cloneForInstructions(source) {
  const clone = source.clone(true);
  isolateMaterials(clone);
  polishLDrawMaterials(clone);
  annotateBuildSteps(clone);
  return clone;
}

function disposeCloneMaterials(root) {
  const materials = new Set();

  root.traverse(obj => {
    if (!obj.material) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    mats.forEach(material => materials.add(material));
  });

  materials.forEach(material => material.dispose());
}

function collectStepPlacementGroups(root, stepIdx) {
  const candidates = [];

  root.traverse(group => {
    if (!group.isGroup || group === root) return;

    const type = String(group.userData?.type || '');
    const step = Number(group.userData?.buildingStep);

    if (/^(?:Part|Unofficial_Part)$/i.test(type) && step === stepIdx) {
      candidates.push(group);
    }
  });

  // Hand-written models can omit !LDRAW_ORG metadata. Fall back to named
  // top-level groups when there are no explicit physical Part groups.
  if (candidates.length === 0) {
    for (const child of root.children) {
      if (
        child.isGroup &&
        child.name &&
        Number(child.userData?.buildingStep) === stepIdx
      ) {
        candidates.push(child);
      }
    }
  }

  // Avoid moving a nested Part twice if an unusual file declares both an
  // ancestor and descendant as physical parts in the same step.
  const candidateSet = new Set(candidates);
  return candidates.filter(group => {
    let parent = group.parent;
    while (parent && parent !== root) {
      if (candidateSet.has(parent)) return false;
      parent = parent.parent;
    }
    return true;
  });
}

function worldDeltaToLocal(parent, worldDelta) {
  if (!parent) return worldDelta.clone();

  parent.updateWorldMatrix(true, false);
  const inverse = new THREE.Matrix4().copy(parent.matrixWorld).invert();
  const origin = new THREE.Vector3(0, 0, 0).applyMatrix4(inverse);
  const moved = worldDelta.clone().applyMatrix4(inverse);
  return moved.sub(origin);
}

function explodeCurrentStep(root, stepIdx, assemblyBox) {
  if (stepIdx === 0) {
    return { placements: [], restore() {} };
  }

  root.updateMatrixWorld(true);

  const groups = collectStepPlacementGroups(root, stepIdx);
  if (groups.length === 0) {
    return { placements: [], restore() {} };
  }

  const assemblySize = assemblyBox.getSize(new THREE.Vector3());
  const horizontalSpan = Math.max(assemblySize.x, assemblySize.z);

  // One LEGO plate is 8 LDU high, one brick is 24 LDU. Keep enough clearance
  // to visually separate the new piece without throwing it far out of frame.
  const lift = THREE.MathUtils.clamp(
    Math.max(34, assemblySize.y * 0.8, horizontalSpan * 0.16),
    34,
    86
  );

  const placements = [];

  for (const group of groups) {
    group.updateWorldMatrix(true, true);

    const targetBox = new THREE.Box3().setFromObject(group);
    if (targetBox.isEmpty()) continue;

    const targetCenter = targetBox.getCenter(new THREE.Vector3());
    const targetSize = targetBox.getSize(new THREE.Vector3());
    const originalPosition = group.position.clone();

    const localDelta = worldDeltaToLocal(group.parent, new THREE.Vector3(0, lift, 0));
    group.position.add(localDelta);

    placements.push({
      group,
      originalPosition,
      targetCenter,
      targetSize,
    });
  }

  root.updateMatrixWorld(true);

  for (const placement of placements) {
    const explodedBox = new THREE.Box3().setFromObject(placement.group);
    placement.explodedCenter = explodedBox.getCenter(new THREE.Vector3());
    placement.explodedSize = explodedBox.getSize(new THREE.Vector3());
  }

  return {
    placements,
    restore() {
      for (const placement of placements) {
        placement.group.position.copy(placement.originalPosition);
      }
      root.updateMatrixWorld(true);
    },
  };
}

function buildPlacementArrows(placements) {
  if (!placements.length) return null;

  const arrows = new THREE.Group();

  for (const placement of placements) {
    const startCenter = placement.explodedCenter;
    const targetCenter = placement.targetCenter;
    if (!startCenter || !targetCenter) continue;

    const direction = targetCenter.clone().sub(startCenter);
    const distance = direction.length();
    if (distance < 8) continue;

    direction.normalize();

    const partHalfHeight = Math.max(
      placement.explodedSize?.y || 0,
      placement.targetSize?.y || 0
    ) * 0.5;

    // Start just below the exploded part and stop just before the final part
    // center so the arrow does not visually cut through either object.
    const startGap = Math.max(5, Math.min(16, partHalfHeight + 4));
    const endGap = 8;
    const origin = startCenter.clone().addScaledVector(direction, startGap);
    const arrowLength = Math.max(10, distance - startGap - endGap);

    const arrow = new THREE.ArrowHelper(
      direction,
      origin,
      arrowLength,
      INSTR_ARROW_COLOR,
      Math.min(13, Math.max(8, arrowLength * 0.22)),
      Math.min(7, Math.max(4, arrowLength * 0.1))
    );

    arrow.line.material.depthTest = false;
    arrow.line.material.transparent = true;
    arrow.line.material.opacity = 0.95;
    arrow.line.renderOrder = 20;

    arrow.cone.material.depthTest = false;
    arrow.cone.material.transparent = true;
    arrow.cone.material.opacity = 0.95;
    arrow.cone.renderOrder = 20;

    arrows.add(arrow);
  }

  return arrows.children.length ? arrows : null;
}

function disposePlacementArrows(arrows) {
  if (!arrows) return;

  arrows.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
      materials.forEach(material => material.dispose());
    }
  });
}

function buildStepOutline(root, stepIdx) {
  root.updateMatrixWorld(true);

  const outline = new THREE.Group();
  const lineMaterial = new THREE.LineBasicMaterial({
    color: OUTLINE_COLOR,
    transparent: true,
    opacity: 0.88,
    depthTest: true,
    depthWrite: false,
  });

  let lineCount = 0;

  root.traverse(obj => {
    if (!obj.isMesh || !obj.visible || !obj.geometry) return;

    const step = Number.isFinite(obj.userData?.__viewerBuildStep)
      ? obj.userData.__viewerBuildStep
      : 0;
    if (step !== stepIdx) return;

    const position = obj.geometry.getAttribute('position');
    if (!position || position.count < 3) return;

    const edges = new THREE.EdgesGeometry(obj.geometry, 28);
    const edgePosition = edges.getAttribute('position');

    if (!edgePosition || edgePosition.count < 2) {
      edges.dispose();
      return;
    }

    const wire = new THREE.LineSegments(edges, lineMaterial);

    // matrixWorld already contains every parent transform, including the
    // LDraw-to-viewer PI rotation. Applying model.matrixWorld a second time
    // was the cause of the displaced green "ghost" parts in instructions.
    wire.matrixAutoUpdate = false;
    wire.matrix.copy(obj.matrixWorld);

    outline.add(wire);
    lineCount += 1;
  });

  if (lineCount === 0) {
    lineMaterial.dispose();
    return null;
  }

  outline.userData.__lineMaterial = lineMaterial;
  return outline;
}

function disposeOutline(outline) {
  if (!outline) return;

  outline.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
  });

  outline.userData.__lineMaterial?.dispose();
}

function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error('Could not create instruction image.'));
    }, 'image/png');
  });
}

async function generateInstructionCards() {
  if (!model || instructionGenerating) return;

  instructionGenerating = true;
  instructionReady = false;
  const revision = ++instructionRevision;

  createInstructionPlaceholders();

  let offRenderer = null;
  let instructionModel = null;

  try {
    // Let placeholders paint before doing the heavier WebGL work.
    await new Promise(resolve => requestAnimationFrame(resolve));

    const width = 840;
    const height = 630;

    offRenderer = new THREE.WebGLRenderer({
      antialias: true,
      preserveDrawingBuffer: true,
    });
    offRenderer.setPixelRatio(1);
    offRenderer.setSize(width, height, false);
    offRenderer.outputColorSpace = THREE.SRGBColorSpace;
    offRenderer.toneMapping = THREE.NeutralToneMapping;
    offRenderer.toneMappingExposure = 0.9;
    offRenderer.shadowMap.enabled = true;
    offRenderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const instructionScene = new THREE.Scene();
    instructionScene.background = new THREE.Color(0xf3f0e9);

    const instructionPmrem = new THREE.PMREMGenerator(offRenderer);
    const instructionRoom = new RoomEnvironment();
    const instructionEnvironment = instructionPmrem.fromScene(instructionRoom, 0.04).texture;
    instructionScene.environment = instructionEnvironment;
    instructionScene.environmentIntensity = 0.22;
    instructionRoom.dispose();
    instructionPmrem.dispose();

    instructionScene.add(new THREE.HemisphereLight(0xffffff, 0xdfe3e0, 0.5));

    const key = new THREE.DirectionalLight(0xffffff, 1.35);
    key.position.set(-180, 300, 220);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -900;
    key.shadow.camera.right = 900;
    key.shadow.camera.top = 900;
    key.shadow.camera.bottom = -900;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 2200;
    key.shadow.bias = -0.00025;
    key.shadow.normalBias = 0.8;
    key.shadow.radius = 3;
    instructionScene.add(key);

    const shadowFloorMaterial = new THREE.MeshStandardMaterial({
      color: 0xf3f0e9,
      roughness: 0.95,
      metalness: 0,
    });
    const shadowFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(5000, 5000),
      shadowFloorMaterial
    );
    shadowFloor.rotation.x = -Math.PI / 2;
    shadowFloor.receiveShadow = true;
    instructionScene.add(shadowFloor);

    instructionModel = cloneForInstructions(model);
    instructionScene.add(instructionModel);

    const snapshotCamera = new THREE.PerspectiveCamera(36, width / height, 0.1, 100000);

    for (let stepIdx = 0; stepIdx < stepData.length; stepIdx++) {
      if (revision !== instructionRevision) return;

      applyInstructionAppearance(instructionModel, stepIdx);
      instructionModel.updateMatrixWorld(true);

      // Capture the assembled target bounds before moving the current step.
      const assembledBox = getRenderableBounds(instructionModel, true);
      shadowFloor.position.y = assembledBox.isEmpty() ? -20 : assembledBox.min.y - 2.5;

      // From step 2 onward, show the new part above its final location and draw
      // a placement arrow. Existing pieces keep their real LDraw colours.
      const exploded = explodeCurrentStep(instructionModel, stepIdx, assembledBox);
      instructionModel.updateMatrixWorld(true);

      // Frame both the previous assembly and the exploded current part.
      const box = getRenderableBounds(instructionModel, true);
      fitCameraToBox(
        snapshotCamera,
        box,
        new THREE.Vector3(0.72, 0.58, 0.9),
        1.12
      );

      const arrows = buildPlacementArrows(exploded.placements);
      if (arrows) instructionScene.add(arrows);

      offRenderer.render(instructionScene, snapshotCamera);
      const blob = await canvasToBlob(offRenderer.domElement);

      if (arrows) {
        instructionScene.remove(arrows);
        disposePlacementArrows(arrows);
      }

      exploded.restore();

      if (revision !== instructionRevision) return;

      const objectUrl = URL.createObjectURL(blob);
      instructionObjectUrls.push(objectUrl);

      const container = document.getElementById('instr-render-' + stepIdx);
      if (container) {
        const image = document.createElement('img');
        image.src = objectUrl;
        image.alt = 'Build step ' + (stepIdx + 1);
        image.loading = 'lazy';
        image.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block';

        const label = document.createElement('div');
        label.className = 'instr-action-label';

        const currentKey = document.createElement('span');
        currentKey.className = 'current-key';
        currentKey.textContent = stepIdx === 0 ? 'START' : 'ARROW = ADD';

        label.appendChild(currentKey);

        if (stepIdx > 0) {
          const divider = document.createTextNode('  ·  ');
          const previousKey = document.createElement('span');
          previousKey.className = 'previous-key';
          previousKey.textContent = 'COLORS = ORIGINAL';
          label.append(divider, previousKey);
        }

        container.replaceChildren(image, label);
      }

      // Yield so long instruction sets do not lock the page for one giant task.
      await new Promise(resolve => requestAnimationFrame(resolve));
    }

    if (revision === instructionRevision) {
      instructionReady = true;
    }

  } catch (err) {
    console.error('Instruction rendering failed:', err);

    if (revision === instructionRevision) {
      document.querySelectorAll('.instr-generating').forEach(node => {
        node.replaceChildren();
        node.textContent = 'Could not render this step.';
      });
    }
  } finally {
    if (instructionModel) disposeCloneMaterials(instructionModel);
    if (offRenderer) offRenderer.dispose();

    if (revision === instructionRevision) {
      instructionGenerating = false;
    }
  }
}

// ═══════════════════════════════════════
// GLOBALS / BOOT
// ═══════════════════════════════════════
window.nextStep = nextStep;
window.prevStep = prevStep;
window.goToStep = goToStep;
window.toggleTheme = toggleTheme;
window.openInstructions = openInstructions;
window.closeInstructions = closeInstructions;
Object.defineProperty(window, '_totalSteps', { get: () => stepData.length });

// Synchronize the button with the theme already selected by the early
// localStorage bootstrap, then initialize the WebGL scene using that theme.
applyTheme(isDark ? 'dark' : 'light');
initScene();
</script>
</body>
</html>
