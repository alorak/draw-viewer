name: Deploy Pages on PR merge

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    # pull_request_target runs in the base-branch context (refs/heads/main),
    # which satisfies the github-pages environment branch protection rules.
    # A PR that is merely closed still must not deploy.
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp ldraw-paths.txt _site/ldraw-paths.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
